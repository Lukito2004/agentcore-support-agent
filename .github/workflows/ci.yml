name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Read-only token; CI checks code and never holds AWS credentials or deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

  cdk-synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install CDK CLI
        run: npm install --global aws-cdk

      - name: Install CDK app dependencies
        run: uv sync --locked

      - name: Synthesize the backend stack
        run: cdk synth --quiet
