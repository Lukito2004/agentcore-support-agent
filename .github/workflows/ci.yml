name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Read-only token; CI checks code and never holds AWS credentials or deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned so CI does not silently change when uv releases a new version.
env:
  UV_VERSION: "0.13.9"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-suffix: lint-and-test
          cache-dependency-glob: uv.lock

      - name: Install dev dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

  cdk-synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-suffix: cdk-synth
          cache-dependency-glob: infra/uv.lock

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install CDK CLI
        run: npm install --global aws-cdk

      - name: Install CDK app dependencies
        run: uv sync --locked

      - name: Synthesize the backend stack
        run: cdk synth --quiet
